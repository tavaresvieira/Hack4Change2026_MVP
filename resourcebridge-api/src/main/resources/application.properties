noem spring.application.name=resourcebridge-api

spring.datasource.url=jdbc:mysql://localhost:3306/resourcebridge
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Email (Gmail SMTP) ────────────────────────────────────────────────────────
# Set mail.enabled=true and fill in credentials to activate email sending.
# Gmail setup: Google Account → Security → 2-Step Verification → App passwords
# Generate an app password for "Mail" and paste it below (not your regular password).
mail.enabled=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-gmail@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# The "From" address shown in emails
mail.from=ResourceBridge <your-gmail@gmail.com>

# Base URL for invite links (change for production)
app.base-url=http://localhost:5173
