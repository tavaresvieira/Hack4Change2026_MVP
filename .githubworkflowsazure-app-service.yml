name: Build and deploy ResourceBridge to Azure App Service

on:
  push:
    branches:
      - Diogo-Azure
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Svelte frontend
        working-directory: ./resourcebridge-api/frontend
        run: |
          npm ci
          npm run build

      - name: Copy frontend build into Spring Boot static folder
        run: |
          rm -rf ./resourcebridge-api/src/main/resources/static/*
          cp -r ./resourcebridge-api/frontend/build/* ./resourcebridge-api/src/main/resources/static/

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Spring Boot JAR
        working-directory: ./resourcebridge-api
        run: ./mvnw clean package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: ./resourcebridge-api/target/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: YOUR_AZURE_APP_SERVICE_NAME
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: '*.jar'